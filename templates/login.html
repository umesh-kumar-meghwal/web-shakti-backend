<!doctype html>
<html lang="hi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Login</title>
<style>
body{font-family:system-ui,sans-serif;background:#0f172a;display:flex;min-height:100vh;align-items:center;justify-content:center;margin:0}
.card{background:#fff;padding:32px;border-radius:14px;width:320px}
h2{margin-top:0}
input,button{width:100%;padding:12px;margin-top:12px;border-radius:8px;border:1px solid #cbd5e1;box-sizing:border-box;font-size:15px}
button{background:#f97316;color:#fff;border:none;cursor:pointer;font-weight:600}
.error{color:#dc2626;font-size:14px}
</style></head><body>
<form class="card" method="post">
  <h2>🔐 Admin Login</h2>
  {% with msgs = get_flashed_messages(with_categories=true) %}
    {% for c, m in msgs %}<div class="error">{{ m }}</div>{% endfor %}
  {% endwith %}
  <input type="password" name="password" placeholder="Password" required>
  <button type="submit">Login</button>
</form></body></html>
